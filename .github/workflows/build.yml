name: Build Driver
on: [push]
jobs:
  build:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v3
    
    - name: Add MSBuild
      uses: microsoft/setup-msbuild@v1.1
      
    - name: Install WDK
      shell: powershell
      run: |
        # Скачиваем официальный установщик WDK от Microsoft
        Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?linkid=2166289" -OutFile "wdksetup.exe"
        # Запускаем установку в тихом режиме
        Start-Process -FilePath ".\wdksetup.exe" -ArgumentList "/features + /q" -Wait
        
    - name: Build Solution
      run: msbuild my-battery-driver.sln /p:Configuration=Release /p:Platform=x86
