name: Build Driver
on: [push]
jobs:
  build:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v3
    
    - name: Add MSBuild
      uses: microsoft/setup-msbuild@v1.1
      
    - name: Install SDK and WDK
      shell: powershell
      run: |
        Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?linkid=2196241" -OutFile "$env:TEMP\winsdksetup.exe"
        Start-Process -FilePath "$env:TEMP\winsdksetup.exe" -ArgumentList "/features + /q" -Wait
        Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?linkid=2196230" -OutFile "$env:TEMP\wdksetup.exe"
        Start-Process -FilePath "$env:TEMP\wdksetup.exe" -ArgumentList "/features + /q" -Wait
        
    - name: Build Solution
      run: msbuild my-battery-driver.sln /p:Configuration=Release /p:Platform=x86
      
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BatteryDriver-Binary
        path: x86/Release/
