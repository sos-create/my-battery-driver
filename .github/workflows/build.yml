name: Universal Battery Manager Build

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        platform:
          - Win32
          - x64

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Check project files
        shell: pwsh
        run: |
          $required = @(
            "BatteryDriver.c",
            "BatteryDriver.h",
            "my-battery-driver.sln",
            "my-battery-driver.vcxproj",
            "BatteryGui.c",
            "BatteryAdapters.c",
            "BatteryAdapters.h",
            "BatteryAdapterSdk.h",
            "AdapterTemplate.c",
            "UniversalBatteryManagerAdapterTemplate.vcxproj",
            "README.md",
            "UniversalBatteryManagerGUI.vcxproj"
          )

          foreach ($file in $required) {
            if (!(Test-Path $file)) {
              throw "Missing file: $file"
            }

            Write-Host "Found: $file"
          }

      - name: Build solution
        shell: pwsh
        run: |
          $solution = Join-Path `
            $env:GITHUB_WORKSPACE `
            "my-battery-driver.sln"

          msbuild $solution `
            /m `
            /v:minimal `
            /p:Configuration=Release `
            /p:Platform=${{ matrix.platform }}

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed: $LASTEXITCODE"
          }

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = Join-Path `
            $env:GITHUB_WORKSPACE `
            "artifacts\${{ matrix.platform }}\Release\UniversalBatteryManager.exe"

          if (!(Test-Path $exe)) {
            throw "Executable not found: $exe"
          }

          $gui = Join-Path $env:GITHUB_WORKSPACE "artifacts\${{ matrix.platform }}\Release\UniversalBatteryManagerGUI.exe"
          $adapter = Join-Path $env:GITHUB_WORKSPACE "artifacts\${{ matrix.platform }}\Release\Adapters\UniversalBatteryManagerAdapterTemplate.dll"
          if (!(Test-Path $gui)) {
            throw "GUI executable not found: $gui"
          }

          Write-Host "CLI build successful: $exe"
          if (!(Test-Path $adapter)) { throw "Adapter template DLL not found: $adapter" }
          Write-Host "GUI build successful: $gui"
          Write-Host "Adapter template build successful: $adapter"

      - name: Smoke test executables
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "artifacts\${{ matrix.platform }}\Release\UniversalBatteryManager.exe"
          $gui = Join-Path $env:GITHUB_WORKSPACE "artifacts\${{ matrix.platform }}\Release\UniversalBatteryManagerGUI.exe"

          & $exe --help
          if ($LASTEXITCODE -ne 0) { throw "CLI help smoke test failed" }

          & $exe --list-plans
          if ($LASTEXITCODE -ne 0) { throw "Power plan query smoke test failed" }

          & $gui --smoke-test
          if ($LASTEXITCODE -ne 0) { throw "GUI startup smoke test failed" }

      - name: Package release files
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "artifacts\${{ matrix.platform }}\Release\UniversalBatteryManager.exe"
          $gui = Join-Path $env:GITHUB_WORKSPACE "artifacts\${{ matrix.platform }}\Release\UniversalBatteryManagerGUI.exe"
          $adapter = Join-Path $env:GITHUB_WORKSPACE "artifacts\${{ matrix.platform }}\Release\Adapters\UniversalBatteryManagerAdapterTemplate.dll"
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          $adapterDir = Join-Path $dist "Adapters"
          New-Item -ItemType Directory -Force -Path $adapterDir | Out-Null
          Copy-Item $exe (Join-Path $dist "UniversalBatteryManager.exe")
          Copy-Item $gui (Join-Path $dist "UniversalBatteryManagerGUI.exe")
          Copy-Item $adapter (Join-Path $adapterDir "UniversalBatteryManagerAdapterTemplate.dll")
          $packaged = @(Get-ChildItem $dist -File -Recurse)
          if ($packaged.Count -ne 3) { throw "Expected exactly 3 release files, found $($packaged.Count)" }
          Write-Host "Packaged clean release: $($packaged.Count) files"

      - name: Upload compiled files
        uses: actions/upload-artifact@v4

        with:
          name: UniversalBatteryManager-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
