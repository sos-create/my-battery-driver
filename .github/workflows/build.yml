name: Universal Battery Manager Build

on:
  push:

  pull_request:

  workflow_dispatch:

jobs:

  build:

    runs-on: windows-2022

    steps:

      - name: Download source
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build x86
        shell: pwsh
        run: |
          msbuild my-battery-driver.sln `
            /m `
            /p:Configuration=Release `
            /p:Platform=Win32

      - name: Build x64
        shell: pwsh
        run: |
          msbuild my-battery-driver.sln `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64

      - name: Upload compiled files
        uses: actions/upload-artifact@v4

        with:

          name: UniversalBatteryManager-Windows

          path: artifacts/

          if-no-files-found: error
